# =====================================================================
# Render Blueprint — Hridaya Creations backend
#
# The live backend is deployed at:
#   https://hridaya-creations-backend.onrender.com   (Docker, region: oregon)
#
# DATABASE NOTE:
#   The database is hosted on NEON (https://neon.tech), external to this
#   blueprint. Neon REQUIRES SSL, so the connection string must include
#   `?sslmode=require`. Set the connection values in the Render dashboard
#   (never commit DB credentials to a public repo):
#
#     DB_URL       jdbc:postgresql://<endpoint>.<region>.aws.neon.tech/<db>?sslmode=require
#     DB_USERNAME  <neon role>
#     DB_PASSWORD  <neon password>
#
#   Use Neon's DIRECT (non-pooled) endpoint — HikariCP already pools, and the
#   direct endpoint supports server-side prepared statements that Hibernate
#   relies on (Neon's PgBouncer pooler runs in transaction mode and would need
#   prepared statements disabled). Pick the Neon region CLOSEST to this Render
#   service (region: oregon below) -> AWS "US West 2 (Oregon)" to minimise
#   query latency between the backend and the database.
#
#   Tables stay isolated under the `hridaya` schema (JPA_DEFAULT_SCHEMA +
#   Hibernate create_namespaces in application-prod.yml), which is harmless on
#   a dedicated Neon database and keeps the app portable.
#
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repo.
# Docs:   https://render.com/docs/blueprint-spec  |  https://neon.tech/docs
# =====================================================================

services:
  - type: web
    name: hridaya-creations-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    # Monorepo: only rebuild when backend files change.
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # First boot creates the schema/tables. After a successful first deploy
      # you may switch this to "validate" in the dashboard for stricter prod.
      - key: JPA_DDL_AUTO
        value: update
      # All tables are created/queried under this Postgres schema so the app
      # can safely share a database instance with other projects.
      - key: JPA_DEFAULT_SCHEMA
        value: hridaya
      - key: SEED_SAMPLE_DATA
        value: "true"
      - key: CLOUDINARY_ENABLED
        value: "false"
      # Recommended: replace "*" with your exact Netlify URL.
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      # Neon PostgreSQL connection — set these in the dashboard (sync: false).
      # DB_URL must be the full Neon JDBC string INCLUDING ?sslmode=require, e.g.
      #   jdbc:postgresql://ep-cool-name-123456.us-west-2.aws.neon.tech/hridaya_creations?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Keep at least 1 idle connection so Neon's compute is reachable quickly;
      # lower DB_POOL_MIN_IDLE to 0 if you want Neon to scale-to-zero (autosuspend)
      # and save free-tier compute hours, at the cost of a cold-start on first query.
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: DB_POOL_MAX_SIZE
        value: "10"
